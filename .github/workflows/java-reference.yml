name: Java reference TCK
on:
  # Automatic CI disabled at the user's request. Workflow is also disabled in GitHub.
  workflow_dispatch:
jobs:
  java-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: |
            upstream/unit-tck/pom.xml
            upstream/indriya/pom.xml
      - name: Build pinned Indriya reference
        run: mvn -B -f upstream/indriya/pom.xml -DskipTests install
      - name: Run pinned Java TCK against Indriya
        run: python3 tools/run_pinned_tck.py
      - name: Build Java fixture runner
        run: mvn -B -f conformance/java-reference/pom.xml -DskipTests package dependency:build-classpath -Dmdep.outputFile=classpath.txt
      - name: Run Indriya fixtures
        shell: bash
        run: |
          java -cp "conformance/java-reference/target/classes:$(cat conformance/java-reference/classpath.txt)" org.sharpunits.ReferenceRunner conformance/java-reference/cases.json > java-reference.jsonl
          python3 tools/check_fixture_expectations.py conformance/java-reference/cases.json java-reference.jsonl
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Compare real Java and .NET fixture results
        shell: bash
        run: |
          dotnet build src/SharpUnits.ConformanceRunner/SharpUnits.ConformanceRunner.csproj -c Release --nologo >&2
          dotnet src/SharpUnits.ConformanceRunner/bin/Release/net10.0/SharpUnits.ConformanceRunner.dll conformance/java-reference/cases.json > dotnet-reference.jsonl
          python3 tools/compare_java_dotnet.py java-reference.jsonl dotnet-reference.jsonl
      - name: Upload differential evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-dotnet-differential
          path: |
            java-reference.jsonl
            dotnet-reference.jsonl
          if-no-files-found: warn
      - name: Upload Java test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-reference-test-reports
          path: |
            upstream/unit-tck/**/surefire-reports/**
            upstream/indriya/**/surefire-reports/**
          if-no-files-found: warn
