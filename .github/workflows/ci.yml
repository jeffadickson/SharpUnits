name: .NET CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore solution
        run: dotnet restore SharpUnits.sln
      - name: Build solution
        run: dotnet build SharpUnits.sln -c Release --no-restore --nologo
      - name: Test solution
        run: dotnet test SharpUnits.sln -c Release --no-build --nologo
      - name: Verify NuGet packaging
        if: matrix.os == 'ubuntu-latest'
        run: |
          dotnet pack src/SharpUnits.Analyzers/SharpUnits.Analyzers.csproj -c Release --no-build -o ./nupkgs --nologo
          dotnet pack src/SharpUnits/SharpUnits.csproj -c Release --no-build -o ./nupkgs --nologo
          dotnet pack src/SharpUnits.Electrical/SharpUnits.Electrical.csproj -c Release --no-build -o ./nupkgs --nologo
          dotnet pack src/SharpUnits.Metrology/SharpUnits.Metrology.csproj -c Release --no-build -o ./nupkgs --nologo
          dotnet pack src/SharpUnits.Formulas/SharpUnits.Formulas.csproj -c Release --no-build -o ./nupkgs --nologo
          dotnet pack src/SharpUnits.SysMl/SharpUnits.SysMl.csproj -c Release --no-build -o ./nupkgs --nologo
          dotnet pack src/SharpUnits.Interop/SharpUnits.Interop.csproj -c Release --no-build -o ./nupkgs --nologo
      - name: Verify Bode frequency-response export
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          dotnet run --project demo/SharpUnits.BodeDemo.csproj -c Release --no-build > bode-output.csv
          python3 tools/verify_bode_export.py bode-output.csv
      - name: Upload Bode numerical evidence
        if: matrix.os == 'ubuntu-latest' && always()
        uses: actions/upload-artifact@v4
        with:
          name: bode-numerical-evidence
          path: bode-output.csv
          if-no-files-found: warn
