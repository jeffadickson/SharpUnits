name: .NET CI
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Require complete source tree
        shell: bash
        run: |
          test -f src/SharpUnits/SharpUnits.csproj
          test -f src/SharpUnits.AngouriMath/SharpUnits.AngouriMath.csproj
          test -f tests/SharpUnits.Tests/SharpUnits.Tests.csproj
          test -f tests/SharpUnits.AngouriMath.Tests/SharpUnits.AngouriMath.Tests.csproj
      - name: Restore core tests
        run: dotnet restore tests/SharpUnits.Tests/SharpUnits.Tests.csproj
      - name: Test core
        run: dotnet test tests/SharpUnits.Tests/SharpUnits.Tests.csproj -c Release --no-restore
      - name: Restore AngouriMath tests
        run: dotnet restore tests/SharpUnits.AngouriMath.Tests/SharpUnits.AngouriMath.Tests.csproj
      - name: Test AngouriMath adapter
        run: dotnet test tests/SharpUnits.AngouriMath.Tests/SharpUnits.AngouriMath.Tests.csproj -c Release --no-restore
