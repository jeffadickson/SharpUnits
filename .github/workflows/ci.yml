name: .NET CI
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Require source tree
        shell: bash
        run: test -f src/SharpUnits/SharpUnits.csproj && test -f tests/SharpUnits.Tests/SharpUnits.Tests.csproj
      - name: Restore
        run: dotnet restore tests/SharpUnits.Tests/SharpUnits.Tests.csproj
      - name: Test
        run: dotnet test tests/SharpUnits.Tests/SharpUnits.Tests.csproj -c Release --no-restore
